# bb-fork(windows): fork-owned workflow. Upstream's Windows jobs run on its
# Blacksmith fleet inside ci.yml; the fork runs the native host lifecycle smoke
# on GitHub-hosted windows-latest instead.

name: Windows lifecycle

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

env:
  NODE_VERSION: "22.19"
  PNPM_VERSION: "9.15.0"

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}-${{ github.ref == 'refs/heads/main' && github.sha || 'latest' }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  lifecycle:
    name: Windows host lifecycle (Node 22.x)
    runs-on: windows-latest
    timeout-minutes: 60
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Fetch upstream main
        run: git fetch --no-tags https://github.com/get-bb/bb.git main:refs/remotes/upstream/main

      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Check generated files
        run: pnpm run check:generated

      - name: Run host lifecycle smoke
        shell: cmd
        env:
          TEMP: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
        run: pnpm exec turbo run test:windows:lifecycle --output-logs=new-only

      - name: Upload smoke evidence
        if: failure()
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-lifecycle-evidence-${{ github.run_attempt }}
          path: ${{ runner.temp }}/bb-windows-smoke-*/
          if-no-files-found: ignore
          include-hidden-files: true
          retention-days: 7
